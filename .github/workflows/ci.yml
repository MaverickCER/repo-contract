name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede an in-progress PR run when the PR is pushed again. The older run's result is worthless
# once the branch has moved. The group is keyed by PR number for pull_request events and by ref
# otherwise. So distinct branches and every push-to-main run stay isolated and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Explicit least-privilege default, as in env-cap's and data-cap's ci.yml. Every job's GITHUB_TOKEN
# scope is then a property of this file. It is not an assumption about the repo's or org's ambient
# default.
permissions:
  contents: read

jobs:
  # Runs first on every PR. When the PR's diff touches benchmarked code, it commits refreshed results
  # onto the PR branch. Every job that needs `verify` or `lint` checks out the branch's live head. So
  # `contract` validates this job's commit: one commit, one CI pass.
  #
  # It mirrors env-cap's and data-cap's `benchmark-pr` job with one difference. Those repositories
  # call internal-package-contract's reusable `benchmark-pr.yml`. That workflow hardcodes two
  # categories, `performance-runtime` and `performance-buildtime`, as directory names and labels.
  # repo-contract has four categories (benchmarks/README.md says why). So this job runs the scripts
  # the reusable workflow calls in a loop over the four categories. Those are
  # `scripts/benchmark/render-summary.mjs` and `append-history.mjs`. The PR checkout needs no
  # `npm run build` step. All four categories import source directly through `tsx`.
  #
  # The guards below and the per-PR concurrency group match the reusable workflow's. The guards are
  # `github.actor != 'github-actions[bot]'` and same-repository PRs only. They stop a GITHUB_TOKEN
  # push from re-triggering `pull_request: synchronize`. Without them, the job would loop on
  # benchmark-timing noise.
  benchmark-pr:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: benchmarks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    # Exposes the exact commit this job validated (after its own possible push) as a job output. Every
    # downstream job checks out that same SHA. It does not re-resolve `refs/pull/{N}/head` at whatever
    # moment it happens to run. That closes a narrow but real skew window for a long-running workflow.
    # The ref could move before a downstream job's checkout.
    outputs:
      sha: ${{ steps.resolve-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - run: npm ci

      # Two committed references: main's results (the previous run) and the last release's. The
      # release is a fixed point, so a series of small regressions cannot ratchet "previous" upward
      # unnoticed. Their overhead ratios are judged only when they were measured on this CPU model.
      # The reusable benchmark-pr workflow uses the same two for env-cap and data-cap.
      - name: Snapshot main's and the last release's committed results
        run: |
          mkdir -p /tmp/benchmark-previous /tmp/benchmark-release
          TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' origin/main 2>/dev/null || true)
          for dir in performance-checks performance-policy-evidence performance-api-contract performance-exceptions; do
            git show "origin/main:benchmarks/${dir}/results.json" > "/tmp/benchmark-previous/${dir}.json" 2>/dev/null || echo '{}' > "/tmp/benchmark-previous/${dir}.json"
            if [ -n "$TAG" ]; then
              git show "${TAG}:benchmarks/${dir}/results.json" > "/tmp/benchmark-release/${dir}.json" 2>/dev/null || echo '{}' > "/tmp/benchmark-release/${dir}.json"
            else
              echo '{}' > "/tmp/benchmark-release/${dir}.json"
            fi
          done

      # For fast work the overhead ratio depends on the machine, since process start-up differs by
      # CPU. So the judged reference is main measured on this runner, minutes before the pull request.
      # That is main's suite files at its commit, at the typical size only. The reusable workflow does
      # the same.
      - name: Measure main's end-to-end pair on this runner
        run: |
          mkdir -p /tmp/benchmark-main
          git worktree add --detach /tmp/main-checkout origin/main
          (cd /tmp/main-checkout && npm ci --ignore-scripts && npm run build)
          for dir in performance-checks performance-policy-evidence performance-api-contract performance-exceptions; do
            if [ -f "/tmp/main-checkout/benchmarks/${dir}/suite.mjs" ]; then
              npx tsx node_modules/internal-package-contract/scripts/benchmark/run-suite.mjs \
                "/tmp/main-checkout/benchmarks/${dir}/suite.mjs" --only end-to-end --typical-only \
                --out "/tmp/benchmark-main/${dir}"
            else
              mkdir -p "/tmp/benchmark-main/${dir}" && echo '{}' > "/tmp/benchmark-main/${dir}/results.json"
            fi
          done
          git worktree remove --force /tmp/main-checkout

      - run: npm run benchmark

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: |
            benchmarks/performance-checks/results.json
            benchmarks/performance-checks/BENCHMARKS.md
            benchmarks/performance-policy-evidence/results.json
            benchmarks/performance-policy-evidence/BENCHMARKS.md
            benchmarks/performance-api-contract/results.json
            benchmarks/performance-api-contract/BENCHMARKS.md
            benchmarks/performance-exceptions/results.json
            benchmarks/performance-exceptions/BENCHMARKS.md
          retention-days: 14

      - name: Post or update the marker-tagged summary comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `--gate` fails this job, and so `required`, on a growth class worse than documented. It
          # also fails on an overhead ratio past the budget in benchmarks/budgets.mjs. The comment is
          # posted either way.
          node node_modules/internal-package-contract/scripts/benchmark/render-summary.mjs \
            --budgets benchmarks/budgets.mjs \
            --marker "<!-- repo-contract-benchmark-summary -->" \
            --gate \
            --example "Checks (\`benchmarks/performance-checks\`)|/tmp/benchmark-previous/performance-checks.json|benchmarks/performance-checks/results.json|benchmarks/history/checks.json|/tmp/benchmark-release/performance-checks.json|/tmp/benchmark-main/performance-checks/results.json" \
            --example "Policy & evidence (\`benchmarks/performance-policy-evidence\`)|/tmp/benchmark-previous/performance-policy-evidence.json|benchmarks/performance-policy-evidence/results.json|benchmarks/history/policy-evidence.json|/tmp/benchmark-release/performance-policy-evidence.json|/tmp/benchmark-main/performance-policy-evidence/results.json" \
            --example "API contract (\`benchmarks/performance-api-contract\`)|/tmp/benchmark-previous/performance-api-contract.json|benchmarks/performance-api-contract/results.json|benchmarks/history/api-contract.json|/tmp/benchmark-release/performance-api-contract.json|/tmp/benchmark-main/performance-api-contract/results.json" \
            --example "Exception helpers (\`benchmarks/performance-exceptions\`)|/tmp/benchmark-previous/performance-exceptions.json|benchmarks/performance-exceptions/results.json|benchmarks/history/exceptions.json|/tmp/benchmark-release/performance-exceptions.json|/tmp/benchmark-main/performance-exceptions/results.json" \
            > /tmp/summary.md || GATE_FAILED=1
          PR="${{ github.event.pull_request.number }}"
          MARKER="<!-- repo-contract-benchmark-summary -->"
          # `--paginate`: a long-lived PR can carry more comments than the API's single-page default.
          # Without it, an existing marker comment on page 2 or later stays hidden. A duplicate would
          # then be posted instead of an update.
          EXISTING=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR}/comments" --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)
          # `-F` (`--field`), not `-f` (`--raw-field`): only `-F`'s "@<path>" reads the value from a
          # file. `-f` treats "@/tmp/summary.md" as the literal string body. It would post that text
          # verbatim instead of the file's real contents.
          if [ -n "$EXISTING" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${EXISTING}" -X PATCH -F body=@/tmp/summary.md
          else
            gh api "repos/${{ github.repository }}/issues/${PR}/comments" -X POST -F body=@/tmp/summary.md
          fi
          # Fail after posting, so the reason is on the pull request. A gate that only commented was ignored.
          if [ "${GATE_FAILED:-0}" = "1" ]; then
            echo "::error::a benchmark gate failed; see the summary comment on the pull request"
            exit 1
          fi

      - name: Commit refreshed results + history into this PR, only when it touches benchmarked code
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment, not interpolated into `run`. An attacker can influence a
          # branch name, so it must never be spliced into shell text.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          # A change to package.json or package-lock.json counts too. A dependency bump can shift
          # timings as much as a src/ change. Skipping the refresh would leave results measured on an
          # older dependency tree.
          RELEVANT=$(echo "$CHANGED" | grep -E "^(src/|benchmarks/|package\.json$|package-lock\.json$)" | grep -vE "^benchmarks/(performance-[^/]+/(results\.json|BENCHMARKS\.md)$|history/)" || true)
          if [ -z "$RELEVANT" ]; then
            echo "This PR doesn't touch benchmarked code paths -- comment posted above, nothing to commit."
            exit 0
          fi

          node node_modules/internal-package-contract/scripts/benchmark/append-history.mjs \
            benchmarks/performance-checks/results.json benchmarks/history/checks.json
          node node_modules/internal-package-contract/scripts/benchmark/append-history.mjs \
            benchmarks/performance-policy-evidence/results.json benchmarks/history/policy-evidence.json
          node node_modules/internal-package-contract/scripts/benchmark/append-history.mjs \
            benchmarks/performance-api-contract/results.json benchmarks/history/api-contract.json
          node node_modules/internal-package-contract/scripts/benchmark/append-history.mjs \
            benchmarks/performance-exceptions/results.json benchmarks/history/exceptions.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            benchmarks/performance-checks/results.json benchmarks/performance-checks/BENCHMARKS.md \
            benchmarks/performance-policy-evidence/results.json benchmarks/performance-policy-evidence/BENCHMARKS.md \
            benchmarks/performance-api-contract/results.json benchmarks/performance-api-contract/BENCHMARKS.md \
            benchmarks/performance-exceptions/results.json benchmarks/performance-exceptions/BENCHMARKS.md \
            benchmarks/history/checks.json benchmarks/history/policy-evidence.json benchmarks/history/api-contract.json benchmarks/history/exceptions.json
          if git diff --cached --quiet; then
            echo "Freshly measured results match what's already committed -- nothing to push."
            exit 0
          fi
          git commit -m "chore(benchmarks): refresh results.json"
          git push origin HEAD:"$HEAD_REF"

      # Default `if:` (success()), not `always()`. If the step above fails (say the push is rejected
      # because the branch moved), this must not run. `always()` would export the unpushed local SHA,
      # which no downstream checkout can resolve.
      - name: Resolve this job's own final commit SHA
        id: resolve-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The OS axis runs only what differs by platform. That is the build, the e2e consumer-install suite,
  # and the unit tests that assert OS-specific behaviour. Those cover Windows taskkill, process trees
  # and spawn-check's cmd.exe routing (see test/unit/cross-platform/). `npm pack` and install are
  # OS-sensitive (scripts/npm-pack.mjs handles Windows `npm.cmd`). The e2e suite catches a tarball
  # missing its `dist/*.d.ts` files. Typecheck, lint, format, architecture, schema, the integration
  # and property suites, and size give the same result on every OS. They run once, in `lint` below.
  # `npm run contract` in the `contract` job is the gate for all of it.
  verify:
    needs: [benchmark-pr]
    # A skipped benchmark-pr (every push to main, every fork PR) must not skip this job. So `always()`
    # opts back in on a skip. A failed benchmark-pr skips it, and `contract` then fails on that
    # failure in its first step. That is needed because GitHub counts a skipped required check as
    # passing.
    if: always() && (needs.benchmark-pr.result == 'success' || needs.benchmark-pr.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `benchmark-pr`'s resolved SHA is the commit it validated. It is taken after any push of
          # its own (its `resolve-sha` step). Re-resolving `refs/pull/{N}/head` later could pick up a
          # newer commit. When `benchmark-pr` did not run (a push to main, a fork PR, the bot's own
          # run), fall back to the ref formula. That formula is used everywhere in this file.
          # `refs/pull/<N>/head` resolves for a fork PR too.
          ref: ${{ needs.benchmark-pr.outputs.sha || (github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref) }}
          # No job here pushes, so nothing needs the checkout's stored token.
          # Do not leave it in `.git/config` for later steps.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - run: npm ci
      - run: npm run build
      - run: npx node scripts/run-test-category.mjs unit
      # The `test-e2e` check runs run-test-category.mjs the same way (repo-contract.config.ts). `npx`
      # puts `vitest` on PATH, as above. The suite test/e2e/consumer-install.test.ts packs the
      # package, installs the tarball and imports it as ESM and CommonJS. That proves the built
      # artifact works from a clean install, not only the source tree.
      - run: npx node scripts/run-test-category.mjs e2e
      # The path-sensitive work runs on every OS here. `contract` runs on Ubuntu only. The packed
      # tarball is installed into a scratch project, and every entry point and the CLI are imported
      # and run. `published-floor` does the same on the Node floor. The build and tests must leave the
      # tree as checked out. Otherwise a generated file that differs on Windows or macOS would reach a
      # consumer first.
      - name: Pack the tarball and smoke it as a consumer
        shell: bash
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts
          node scripts/smoke-consumer.mjs artifacts
      - name: Working tree is clean after the build, tests and smoke
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- . ':!artifacts')" ]; then
            echo "::error::The build, tests or tarball smoke left the working tree dirty on ${{ matrix.os }}:"
            git status --porcelain -- . ':!artifacts'
            git diff -- . ':!artifacts' | head -200
            exit 1
          fi

  # The platform-independent checks run once here instead of on every OS. They are typecheck, lint,
  # format, the architecture smoke check, schema generation, the test:coverage aggregate (unit,
  # integration, property), and size. Each step fails the job on an error. So a broken build, lint or
  # test fails fast, before the slower `contract` job spends its mutation budget. `contract` judges
  # the same tools again as policies.
  lint:
    needs: [benchmark-pr]
    # Same reasoning as `verify`'s own identical condition above.
    if: always() && (needs.benchmark-pr.result == 'success' || needs.benchmark-pr.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same SHA choice as `verify`'s checkout above. Prefer benchmark-pr's resolved SHA output,
          # else re-resolve the ref formula.
          ref: ${{ needs.benchmark-pr.outputs.sha || (github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref) }}
          # No job here pushes, so nothing needs the checkout's stored token.
          # Do not leave it in `.git/config` for later steps.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # A read-only `prettier --check .`, not `npm run format`. That script runs `--write` and exits 0
      # after rewriting. So it could never fail on unformatted code.
      - run: npm run format:check
      # The `architecture` check runs this script too (repo-contract.config.ts). It is static and
      # needs no build. It checks the src/ dependency graph and that each test category's Vitest
      # config stays in its own directory (specs/verification-taxonomy.md). Here it is a "does not
      # crash" smoke check. The `architecture` policy in `contract` is the gate. `npx`, not bare
      # `node`, puts the script's `depcruise` sub-spawn on PATH through node_modules/.bin.
      - run: npx node scripts/check-architecture.mjs
      - run: npm run build
      - run: npm run schema
      # Unit, integration and property run independently, then are aggregated. The total is judged
      # against this repository's coverage thresholds (scripts/run-coverage.mjs exits 1 below them).
      # The `coverage` check in `contract` judges the same numbers.
      - run: npm run test:coverage
      # Exits 1 over a budget (scripts/check-size.mjs); the `size` check in
      # `contract` enforces the same budgets.
      - run: npm run size

  # Bun and Deno consume the packed tarball (see
  # specs/decisions/0003-cross-platform-command-execution-and-process-cleanup.md). One OS and one Node
  # version are enough: neither runtime invokes Node. The test/e2e/consumer-install-{bun,deno}.test.ts
  # suites skip when their runtime is not on PATH. Installing both here through their official setup
  # actions makes this job run them.
  runtime-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes, so nothing needs the checkout's stored token.
          # Do not leave it in `.git/config` for later steps.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Same Node line as `verify` and `contract`. This job runs the repo's own test harness
          # (vitest). So it belongs on the verification-toolchain Node version, not the published
          # floor.
          node-version: 24.x

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - run: npm ci
      - run: npm run build
      - run: npx node scripts/run-test-category.mjs e2e

  verify-current:
    runs-on: ubuntu-latest
    # A canary, not a required gate. It runs the newest Node line, ahead of the .nvmrc line (24.x
    # above). So an incompatibility shows before that version is adopted. A new Node line often fails
    # here because a devDependency does not support it yet. This package cannot control that.
    # `continue-on-error` keeps that lag from blocking every PR, and the result stays visible.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes, so nothing needs the checkout's stored token.
          # Do not leave it in `.git/config` for later steps.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run size

  # Builds the package once, on the .nvmrc Node line. `published-floor` gets the tarball. Nothing
  # downstream rebuilds it. So the artifact tested on the Node floor is the one the modern toolchain
  # produced.
  package-build:
    # `benchmark-pr` is listed directly, not only transitively via `verify`. So this job can address
    # its `outputs.sha` below. A job's `needs` context only exposes outputs from its own direct
    # dependencies.
    needs: [verify, benchmark-pr]
    # GitHub's default `success()` walks the whole transitive `needs` graph. A skipped `benchmark-pr`
    # in `verify`'s ancestry would skip this job even when `verify` passed. Same fix as `contract`.
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') && (needs.benchmark-pr.result == 'success' || needs.benchmark-pr.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `benchmark-pr`'s resolved SHA. The tarball is then built from the tree `contract`
          # validated, not a snapshot from before the benchmark refresh. It falls back to the usual
          # ref formula when `benchmark-pr` did not run.
          ref: ${{ needs.benchmark-pr.outputs.sha || (github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref) }}
          # No job here pushes, so nothing needs the checkout's stored token.
          # Do not leave it in `.git/config` for later steps.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - run: npm ci
      - run: npm run build
      # `npm pack --pack-destination` does not create the target directory.
      - run: mkdir -p ./artifacts
      - run: npm pack --pack-destination ./artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tarball
          path: artifacts/*.tgz
          retention-days: 1
          if-no-files-found: error

  # Proves the Node floor as a consumer meets it. It installs the packed tarball into a scratch
  # project on each Node version `engines.node` promises, and exercises every entry point. It never
  # runs `npm ci`, the build or the test harness. So a devDependency that needs a newer Node cannot
  # affect it. See scripts/smoke-consumer.mjs.
  published-floor:
    # `benchmark-pr` is listed directly so this job can address its `outputs.sha` below. See
    # `package-build`'s identical note.
    needs: [package-build, benchmark-pr]
    # Same transitive-skip reasoning as `package-build`'s own identical-shaped condition above.
    if: always() && (needs.package-build.result == 'success' || needs.package-build.result == 'skipped') && (needs.benchmark-pr.result == 'success' || needs.benchmark-pr.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `benchmark-pr`'s resolved SHA, so scripts/smoke-consumer.mjs is the version `contract`
          # validated. It falls back to the usual ref formula when `benchmark-pr` did not run (see
          # `package-build`).
          ref: ${{ needs.benchmark-pr.outputs.sha || (github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref) }}
          # No job here pushes, so nothing needs the checkout's stored token.
          # Do not leave it in `.git/config` for later steps.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No npm cache in any job. A cache written by pull-request code can be poisoned. This job never
          # runs `npm ci` anyway.
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-tarball
          path: artifacts

      - run: node scripts/smoke-consumer.mjs artifacts

  # The examples are real projects linked to this repository through `file:` (examples/package.json is
  # an npm workspace). The script scripts/run-examples.mjs runs each example's main command. It
  # compares the exit code and the output lines its README shows. It fails when one no longer matches.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run build
      - run: npm ci --no-audit --no-fund
        working-directory: examples
      - run: node scripts/run-examples.mjs

  # Installs the packed tarball with npm, pnpm, Yarn 1 and Yarn Berry (node-modules linker). It imports
  # every entry point as ESM and as CommonJS (scripts/package-managers-smoke.mjs). That is all it
  # proves. Yarn Plug'n'Play and pnpm without hoisting are documented as unsupported.
  package-managers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - run: corepack enable
      - run: npm ci
      - run: npm run build
      - run: npm run package-managers

  # The development toolchain stays on TypeScript 6. The reason: typescript-eslint, typedoc and API
  # Extractor cannot load the TypeScript 7 compiler API. So TypeScript 7 gets its own job, and the
  # source must type-check under it. `npx -p` supplies the 7 binary. Type imports still resolve
  # against the repository's own `typescript`.
  typescript-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - run: npm ci
      - run: npx --yes -p typescript@7 tsc --noEmit -p tsconfig.json

  # Proves the shipped .d.ts files compile in a consumer's toolchain. It uses the newest release
  # of TypeScript 5, 6 and 7; older 5.x releases are not tested. This repository's own tsconfig
  # uses moduleResolution "Bundler" and one pinned typescript. So it tests neither nodenext
  # resolution nor another major. See scripts/typescript-compat.mjs.
  typescript-compat:
    # `benchmark-pr` is listed directly so this job can address its `outputs.sha` below. See
    # `package-build`'s identical note.
    needs: [package-build, benchmark-pr]
    # Same transitive-skip reasoning as `package-build`'s own identical-shaped condition above.
    if: always() && (needs.package-build.result == 'success' || needs.package-build.result == 'skipped') && (needs.benchmark-pr.result == 'success' || needs.benchmark-pr.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same checkout-override reasoning as `published-floor`'s identical `ref:`. This job's own
          # `scripts/typescript-compat.mjs` must be the same version `contract` validated.
          ref: ${{ needs.benchmark-pr.outputs.sha || (github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref) }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-tarball
          path: artifacts

      - run: node scripts/typescript-compat.mjs artifacts

  # The slow self-hosting proof: runs repo-contract.config.ts through the freshly built public API. That
  # file's `checks` record is the list of what runs. The taxonomy in specs/verification-taxonomy.md
  # says what each check establishes. Every check is platform-independent and mutation testing
  # dominates the runtime, so one Node version is enough. It is the .nvmrc line, which meets the
  # >=22.0.0 that @stryker-mutator/core requires. That is a development requirement, separate from the
  # published engines.node floor that `published-floor` proves. It waits on `verify` and `lint`. So a
  # broken build or OS-specific test fails once, fast, before the mutation budget is spent.
  contract:
    # `benchmark-pr` is listed directly, not only transitively via `verify` and `lint`. So this job
    # can address its `outputs.sha` below. A job's `needs` context only exposes outputs from its own
    # direct dependencies.
    needs: [verify, lint, benchmark-pr]
    # Always runs, so it can never be skipped: GitHub counts a skipped required check as passing. The
    # first step fails it when benchmark-pr failed or verify or lint did not pass. So a benchmark
    # failure blocks the merge through `contract` as well as through `required`.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The code-scanning check reads the repository's open alerts.
      security-events: read
    steps:
      - name: benchmark-pr, verify and lint passed
        if: needs.verify.result != 'success' || needs.lint.result != 'success' || (needs.benchmark-pr.result != 'success' && needs.benchmark-pr.result != 'skipped')
        env:
          BENCHMARK: ${{ needs.benchmark-pr.result }}
          VERIFY: ${{ needs.verify.result }}
          LINT: ${{ needs.lint.result }}
        run: |
          echo "::error::contract needs benchmark-pr to pass or be skipped, and verify and lint to pass (benchmark-pr=$BENCHMARK, verify=$VERIFY, lint=$LINT)"
          exit 1

      # `fetch-depth: 0` (full history, as in release.yml) is required. The adr-governance and
      # commitlint checks read `origin/main..HEAD` (scripts/git-commits.ts, scripts/diff-files.ts). A
      # shallow checkout leaves that range unresolvable on a pull_request build and empty on a push to
      # main. Either way the checks would pass on "nothing changed". `api-contract` reads
      # `.changeset/*.md` instead of commit history, so it no longer needs the depth.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `benchmark-pr`'s resolved SHA is the commit it validated. It is taken after any push of
          # its own. It falls back to the usual ref formula when `benchmark-pr` did not run.
          ref: ${{ needs.benchmark-pr.outputs.sha || (github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref) }}
          fetch-depth: 0
          # This job only reads `origin/main..HEAD` and never pushes. So the checkout's token need not
          # persist into `.git/config`.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - run: npm ci
      - run: npm run build
      # Generates docs/api/ (gitignored) so the `docs` check can follow docs/index.html's link to it.
      # Without it, linkinator would report a 404 on every PR for a link that is live on the site. The
      # Pages deploy regenerates docs/api/ separately on push to main.
      - run: npm run docs:api
      # The contract builds docs/benchmarks (`npm run docs:benchmarks`) before its checks, so the docs check
      # finds the page the docs link to.
      - run: npm run benchmark:check
      - run: npm run contract
        env:
          # The security-socket check scores the package on Socket.dev. Without a token the check
          # warns that the scan did not run. A refused token, network error or rate limit fails it.
          # Token: socket.dev (Settings > API Tokens, `packages:list`), repository secret
          # SOCKET_SECURITY_API_KEY.
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_TOKEN: ${{ github.token }}

      # A contract run can write. `format` and `lint` auto-fix, and `suppression-governance`
      # reconciles `.repo-contract/exceptions/*.json`. It adds a blank stub for a new disable
      # directive and flags a record whose directive moved. On a governed tree the run writes nothing.
      # CI starts from a clean checkout. So any change after the run means an ungoverned finding, an
      # unformatted file or an uncommitted stub. That fails the job
      # (specs/decisions/0013-reusable-exception-policy-helper.md, "review surface" amendment,
      # invariant 8).
      #
      # docs/OpenSSF-Scorecard.md is excluded on purpose. Its generator (render-markdown.ts) stamps a
      # fresh `_Generated <timestamp>_` line on every run. So no local run and commit can make it
      # match. The `pages-content` job publishes it on push to main.
      - name: Working tree is clean after the contract run
        run: |
          if [ -n "$(git status --porcelain -- . ':!docs/OpenSSF-Scorecard.md')" ]; then
            echo "::error::The contract run left the working tree dirty. A new disable directive needs its exception stub filled in and committed (.repo-contract/exceptions/), a file needs formatting, or a stale exception record needs deleting. Run 'npm run contract' locally and commit the result."
            git status --porcelain -- . ':!docs/OpenSSF-Scorecard.md'
            git diff -- . ':!docs/OpenSSF-Scorecard.md'
            exit 1
          fi

      # Handed to `pages-content` below, so it can regenerate docs/*-badge.json without rerunning
      # mutation testing. That is this job's most expensive step. Uploaded on every run because it is
      # cheap. A job condition cannot see whether a later job will need it.
      - name: Upload coverage and mutation reports for badge generation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: badge-source-reports
          path: |
            coverage/aggregate/coverage-summary.json
            reports/mutation/mutation.json
          retention-days: 1
          if-no-files-found: error

      # Handed to `pages-content` below. The `openssf-scorecard` check already wrote this file during
      # `npm run contract`. Uploading it avoids a second contract run, mutation suite included.
      - name: Upload generated evidence docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-evidence-docs
          path: |
            docs/OpenSSF-Scorecard.md
          retention-days: 1
          if-no-files-found: error

  # Regenerates the coverage and mutation badges and the evidence doc. The badges are
  # docs/coverage-badge.json and docs/mutation-badge.json, with coverage.json and mutation.json beside
  # them. It reuses the reports and generated docs `contract` uploaded. A second `npm run contract`
  # would pay for mutation testing twice. The content goes to `deploy` below as a build artifact
  # through actions/deploy-pages, as in env-cap and data-cap. It is never committed to main. It runs
  # on push to main only. On a PR, the numbers are `contract`'s concern.
  pages-content:
    needs: contract
    # `always()` plus an explicit check of `contract`'s result. The default `success()` walks
    # `contract`'s whole ancestry, and benchmark-pr always skips on a push to main. That would skip
    # this job and `deploy` even when `contract` passed. `contract` itself never skips on a push to
    # main, so no other skip tolerance is needed. The env-cap and data-cap workflows use the same
    # pattern.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always() && needs.contract.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: badge-source-reports

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - run: npm ci

      # The coverage and mutation badges. A details file beside each says which number it shows and
      # lists every value it summarises. The number is the lowest of four coverage measures, or the
      # share of mutants detected. Every package uses this tool, here on this repository's aggregated
      # coverage summary.
      - run: npx --no-install internal-package-contract tool badges --coverage coverage/aggregate/coverage-summary.json --no-size
      - run: node node_modules/internal-package-contract/scripts/run-mutation-badge.mjs

      # Generated on every deploy and never committed, like docs/api/. The benchmark engine of
      # internal-package-contract builds this chart page from the committed benchmarks/history/*.json
      # files. `benchmark-pr` writes them. The page lands at
      # maverickcer.github.io/repo-contract/benchmarks/.
      - run: npm run docs:benchmarks

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-evidence-docs
          path: docs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-content
          path: |
            docs/coverage-badge.json
            docs/coverage.json
            docs/mutation-badge.json
            docs/mutation.json
            docs/OpenSSF-Scorecard.md
            docs/benchmarks/index.html
          retention-days: 1
          if-no-files-found: error

  # Deploys docs/ to GitHub Pages through internal-package-contract's reusable workflow. That is the
  # actions/deploy-pages flow env-cap and data-cap use. `badges-script` stays empty: the badges need
  # the mutation report `contract` produced. So `pages-content` builds them, and
  # `content-artifact-name` hands that content over. The shared workflow runs `docs:api` (TypeDoc) to
  # generate docs/api/ on every deploy. See RELEASING.md's "GitHub Pages" section and the amendment to
  # specs/decisions/0008-self-hosting-tool-and-dependency-choices.md.
  deploy:
    needs: pages-content
    # Same transitive-skip reasoning as `pages-content`'s own identical-shaped condition above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always() && needs.pages-content.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: MaverickCER/internal-package-contract/.github/workflows/deploy-pages-typedoc.yml@de11cec0f2cd93bbac00512ba706db3f4bbf5e09 # v0.19.0
    with:
      docs-script: docs:api
      content-artifact-name: pages-content

  # The ruleset requires this one status check for every job above except `contract` and `lint`.
  # GitHub cannot name a matrix job (`verify (ubuntu-latest)`, `published-floor (22.x)`) as a required
  # context. It also counts a skipped or cancelled job as passing. So this job runs `if: always()` and
  # fails unless each job it needs finished `success`. `benchmark-pr` may skip: it runs only on
  # same-repo pull requests by design. Add every new job to `needs`. The test
  # test/unit/ci/ci-jobs.test.ts fails when one is missing.
  required:
    needs:
      - benchmark-pr
      - verify
      - lint
      - runtime-compat
      - package-build
      - published-floor
      - typescript-7
      - typescript-compat
      - examples
      - contract
      - package-managers
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every gate job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          node -e "const needs = JSON.parse(process.env.NEEDS);
          const maySkip = new Set(['benchmark-pr']);
          const bad = Object.entries(needs).filter(([id, n]) => !(n.result === 'success' || (maySkip.has(id) && n.result === 'skipped')));
          if (bad.length > 0) {
            console.error('::error::not green: ' + bad.map(([id, n]) => id + '=' + n.result).join(', '));
            process.exit(1);
          }"

  # A backstop for squash merges (specs/decisions/0009-conventional-commits-versioning-and-local-gates.md).
  # The merge-commit and rebase policy keeps every commit conforming. If a squash slips through, the PR
  # title is still a valid Conventional Commit.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
