name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede an in-progress PR run when the PR is pushed again -- the older run's
# result is worthless once the branch has moved. Keyed by PR number for
# pull_request events and by ref otherwise, so distinct branches and every
# push-to-main run stay isolated and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Explicit least-privilege default so every job's GITHUB_TOKEN scope is a
# property of this file, not an assumption about the repo/org's ambient
# default -- mirrors env-cap/data-cap's own ci.yml.
permissions:
  contents: read

jobs:
  # Runs first, on every PR, and -- when the PR's own diff touches benchmarked code -- commits
  # refreshed results straight onto the PR branch. Every job below that (transitively) needs
  # `verify`/`lint` checks out the PR branch's own live head rather than the originally-triggered
  # SHA, so whatever this job just committed is exactly what `contract`/etc. actually validate --
  # one real commit, one real CI pass, not two. Mirrors env-cap's/data-cap's own identically-named
  # `benchmark-pr` job (see either repo's ci.yml for the full incident history this design avoids:
  # a GITHUB_TOKEN-authored push re-triggering its own `pull_request: synchronize` and looping
  # indefinitely on real benchmark-timing noise), with one real difference: env-cap/data-cap
  # forward to internal-package-contract's reusable `.github/workflows/benchmark-pr.yml` via
  # `uses:`; that reusable workflow is currently hardcoded to exactly two categories
  # (`performance-runtime`/`performance-buildtime` -- both directory name and PR-comment label are
  # literal, not parameterized), a shape that fits env-cap's/data-cap's two categories but not
  # repo-contract's three (`performance-checks`/`performance-policy-evidence`/
  # `performance-api-contract` -- see benchmarks/README.md for why repo-contract's own
  # performance-sensitive surface splits into three categories instead of two). Rather than modify
  # that shared, other-repositories-depend-on-it-too reusable workflow, this job calls
  # internal-package-contract's own generic script layer directly
  # (`scripts/benchmark/render-summary.mjs`/`append-history.mjs`) -- the exact same scripts the
  # reusable workflow itself calls, looped over repo-contract's three categories inline. No `npm
  # run build` step: unlike env-cap's/data-cap's categories (which benchmark generated *consumer*
  # code against the published package's own `dist/`), all three of repo-contract's categories
  # import repo-contract's (or internal-package-contract's) own source directly via `tsx` -- see
  # benchmarks/README.md.
  #
  # The anti-recursion-loop guard (`github.actor != 'github-actions[bot]'`) and same-repo-PR-only
  # guard below are identical to internal-package-contract's own reusable workflow's guard (see
  # that file's own header comment in internal-package-contract for the incident this specific
  # shape avoids), and the per-PR concurrency group matches it too.
  benchmark-pr:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: benchmarks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    # Exposes the exact commit this job ended up validating (after its own possible push) as a
    # job output, so every downstream job checks out that same precise SHA instead of
    # independently re-resolving `refs/pull/{N}/head` at whatever moment it happens to run --
    # closing a real (if narrow) skew window a long-running workflow could otherwise hit if that
    # ref moved again between this job finishing and a downstream job's own checkout.
    outputs:
      sha: ${{ steps.resolve-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - run: npm ci

      - name: Snapshot main's committed results as "previous"
        run: |
          mkdir -p /tmp/benchmark-previous
          for dir in performance-checks performance-policy-evidence performance-api-contract; do
            git show "origin/main:benchmarks/${dir}/results.json" > "/tmp/benchmark-previous/${dir}.json" || echo '{}' > "/tmp/benchmark-previous/${dir}.json"
          done

      - run: npm run benchmark

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: |
            benchmarks/performance-checks/results.json
            benchmarks/performance-checks/BENCHMARKS.md
            benchmarks/performance-policy-evidence/results.json
            benchmarks/performance-policy-evidence/BENCHMARKS.md
            benchmarks/performance-api-contract/results.json
            benchmarks/performance-api-contract/BENCHMARKS.md
          retention-days: 14

      - name: Post or update the marker-tagged summary comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node node_modules/internal-package-contract/scripts/benchmark/render-summary.mjs \
            --budgets benchmarks/budgets.mjs \
            --marker "<!-- repo-contract-benchmark-summary -->" \
            --example "Checks (\`benchmarks/performance-checks\`)|/tmp/benchmark-previous/performance-checks.json|benchmarks/performance-checks/results.json|benchmarks/history/checks.json" \
            --example "Policy & evidence (\`benchmarks/performance-policy-evidence\`)|/tmp/benchmark-previous/performance-policy-evidence.json|benchmarks/performance-policy-evidence/results.json|benchmarks/history/policy-evidence.json" \
            --example "API contract (\`benchmarks/performance-api-contract\`)|/tmp/benchmark-previous/performance-api-contract.json|benchmarks/performance-api-contract/results.json|benchmarks/history/api-contract.json" \
            > /tmp/summary.md
          PR="${{ github.event.pull_request.number }}"
          MARKER="<!-- repo-contract-benchmark-summary -->"
          # --paginate: a long-lived PR can carry more comments than the API's single-page
          # default, which would otherwise hide an existing marker comment on page 2+ and post a
          # duplicate instead of updating it.
          EXISTING=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR}/comments" --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)
          # -F (--field), not -f (--raw-field): only -F's "@<path>" reads the value from a file --
          # -f treats "@/tmp/summary.md" as the literal string body, posting that text verbatim
          # instead of the file's real contents.
          if [ -n "$EXISTING" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${EXISTING}" -X PATCH -F body=@/tmp/summary.md
          else
            gh api "repos/${{ github.repository }}/issues/${PR}/comments" -X POST -F body=@/tmp/summary.md
          fi

      - name: Commit refreshed results + history into this PR, only when it touches benchmarked code
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment rather than interpolated straight into `run` -- a
          # branch ref is attacker-influenced input and must never be spliced into the shell
          # command text.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          # package.json/package-lock.json count as relevant too -- a dependency bump can shift
          # benchmark timing just as much as a src/ change can, and skipping the refresh here
          # would silently leave stale results committed against a since-changed dependency tree.
          RELEVANT=$(echo "$CHANGED" | grep -E "^(src/|benchmarks/|package\.json$|package-lock\.json$)" | grep -vE "^benchmarks/(performance-[^/]+/(results\.json|BENCHMARKS\.md)$|history/)" || true)
          if [ -z "$RELEVANT" ]; then
            echo "This PR doesn't touch benchmarked code paths -- comment posted above, nothing to commit."
            exit 0
          fi

          node node_modules/internal-package-contract/scripts/benchmark/append-history.mjs \
            benchmarks/performance-checks/results.json benchmarks/history/checks.json
          node node_modules/internal-package-contract/scripts/benchmark/append-history.mjs \
            benchmarks/performance-policy-evidence/results.json benchmarks/history/policy-evidence.json
          node node_modules/internal-package-contract/scripts/benchmark/append-history.mjs \
            benchmarks/performance-api-contract/results.json benchmarks/history/api-contract.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            benchmarks/performance-checks/results.json benchmarks/performance-checks/BENCHMARKS.md \
            benchmarks/performance-policy-evidence/results.json benchmarks/performance-policy-evidence/BENCHMARKS.md \
            benchmarks/performance-api-contract/results.json benchmarks/performance-api-contract/BENCHMARKS.md \
            benchmarks/history/checks.json benchmarks/history/policy-evidence.json benchmarks/history/api-contract.json
          if git diff --cached --quiet; then
            echo "Freshly measured results match what's already committed -- nothing to push."
            exit 0
          fi
          git commit -m "chore(benchmarks): refresh results.json"
          git push origin HEAD:"$HEAD_REF"

      # Default `if:` (implicit success()), not `always()` -- this step must only run once the
      # step above has genuinely succeeded, whether that means it actually committed+pushed or
      # took its no-op `exit 0` early-return path. If that step instead fails outright (e.g. the
      # push is rejected because the PR branch moved during this run), this step must NOT run: an
      # `always()` here would still capture and export the local, committed-but-never-pushed
      # commit's SHA, which no downstream checkout could ever actually resolve.
      - name: Resolve this job's own final commit SHA
        id: resolve-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The OS axis, trimmed to only what genuinely differs by platform: build,
  # the unit tests that actually assert OS-specific behaviour (Windows
  # taskkill, process-tree, spawn-check's cmd.exe routing -- see
  # test/unit/cross-platform/ and the grep for `process.platform`/`win32`
  # across test/), and the e2e consumer-install suite (`npm pack` + install,
  # which itself is OS-sensitive -- see scripts/npm-pack.mjs's Windows
  # `npm.cmd` handling, and is exactly what would have caught a tarball
  # missing its `dist/*.d.ts` files). Everything else this job used to repeat
  # three times (typecheck, lint, format, architecture, schema, the full
  # integration/property test suite, size) is platform-independent -- same
  # result on every OS -- so it now runs exactly once, in `lint` below,
  # instead of being paid for on windows-latest and macos-latest too. The
  # real, authoritative gate for all of it either way is `npm run contract`
  # in the `contract` job.
  verify:
    needs: [benchmark-pr]
    # A skipped dependency isn't a passing one by GitHub's own default job condition -- without
    # this, `verify` (and `lint` below) would themselves always skip whenever `benchmark-pr` does
    # (every push-to-main run, every fork PR), taking every job that needs them, including
    # `contract`, down with them. `always()` opts back into running on a skip; the explicit result
    # check still blocks on a genuine `benchmark-pr` failure.
    if: always() && (needs.benchmark-pr.result == 'success' || needs.benchmark-pr.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `benchmark-pr`'s own resolved SHA output when it ran (the exact commit it validated,
          # after its own possible push -- see that job's own `resolve-sha` step), so this job
          # checks out precisely that commit rather than independently re-resolving
          # `refs/pull/{N}/head` itself at a possibly-later moment. Falls back to the same
          # ref-resolution formula used everywhere else in this file (refs/pull/<N>/head resolves
          # for a fork PR too, whose branch lives in the fork, not this repo) when `benchmark-pr`
          # didn't run at all (push-to-main, a fork PR, or the bot's own retriggered run).
          ref: ${{ needs.benchmark-pr.outputs.sha || (github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref) }}
          # No job here pushes; nothing needs the checkout's stored token, so
          # don't leave it in `.git/config` for later steps to reach.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - run: npm ci
      - run: npm run build
      - run: npx node scripts/run-test-category.mjs unit
      # No wrapper npm script for this anymore -- repo-contract's own
      # `test-e2e` check invokes run-test-category.mjs the same way (see
      # repo-contract.config.ts). Run through `npx` for the same PATH reason
      # as above: this script spawns `vitest` by bare name.
      # test/e2e/consumer-install.test.ts -- a real `npm pack` + tarball
      # install + import (both ESM and CommonJS), proving the built artifact
      # (not just the source tree) actually works from a clean install.
      - run: npx node scripts/run-test-category.mjs e2e

  # The platform-independent checks `verify` used to repeat per-OS above,
  # now run exactly once: typecheck, lint, format, the architecture smoke
  # check, schema generation, the full test:coverage aggregate (unit +
  # integration + property), and size. Same result regardless of OS, so
  # paying for it three times bought nothing but slower PRs. Report-only,
  # same as before -- the real, authoritative gate for all of these is `npm
  # run contract` in the `contract` job below; this job exists purely so a
  # broken build/lint/test fails fast, once, before that much slower job
  # (dominated by mutation testing) spends its budget.
  lint:
    needs: [benchmark-pr]
    # Same reasoning as `verify`'s own identical condition above.
    if: always() && (needs.benchmark-pr.result == 'success' || needs.benchmark-pr.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same "prefer benchmark-pr's own resolved SHA output, fall back to re-resolving the
          # ref formula" reasoning as `verify`'s own identical checkout above.
          ref: ${{ needs.benchmark-pr.outputs.sha || (github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref) }}
          # No job here pushes; nothing needs the checkout's stored token, so
          # don't leave it in `.git/config` for later steps to reach.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # A bare, read-only `prettier --check .` -- not `npm run format`,
      # which runs the auto-fixing (`--write`) preset dogfooded by `npm run
      # contract` and always exits 0 once it finishes rewriting files, so it
      # can never actually fail this gate on unformatted code.
      - run: npm run format:check
      # No wrapper npm script for this anymore -- package.json only carries
      # generic package scripts, and repo-contract's own `architecture`
      # check already invokes this same script directly (see
      # repo-contract.config.ts). Static, no build required -- production
      # src/ dependency graph plus every verification category's own Vitest
      # config staying inside its own directory (see
      # specs/verification-taxonomy.md). Report-only (see the script's own
      # doc comment) -- this step is a "doesn't crash" smoke check now, not
      # a policy gate; `npm run contract` in the `contract` job is the real
      # gate. Run through `npx` (not bare `node`) so the script's own
      # `depcruise` sub-spawn resolves via node_modules/.bin on PATH -- only
      # npm run/npx provide that for a `run:` step, unlike repo-contract's
      # own invocation of this script, which inherits it transitively from
      # the outer `npm run contract`.
      - run: npx node scripts/check-architecture.mjs
      - run: npm run build
      - run: npm run schema
      # Unit + integration + property, each independently, aggregated and
      # reported against this repository's coverage thresholds -- see
      # scripts/run-coverage.mjs. Report-only, same as above: real gating
      # happens in repo-contract's own `coverage` check via `npm run
      # contract`, not here.
      - run: npm run test:coverage
      # Report-only (see scripts/check-size.mjs) -- a smoke check, not a
      # policy gate; repo-contract's `size` check owns the actual required
      # size and is what `npm run contract` enforces.
      - run: npm run size

  # Bun and Deno actually consuming the real, packed tarball -- see
  # specs/decisions/0003-cross-platform-command-execution-and-process-cleanup.md. One OS, one Node
  # version: Bun/Deno compatibility doesn't depend on which Node version or
  # OS also happens to be on the runner (neither runtime invokes Node's own
  # binary), so it isn't re-run across `verify`'s full matrix above. The
  # test/e2e/consumer-install-{bun,deno}.test.ts suites self-skip when their
  # runtime isn't on PATH -- installing both here via their official setup
  # actions is what makes this job actually exercise them instead of skip.
  runtime-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes; nothing needs the checkout's stored token, so
          # don't leave it in `.git/config` for later steps to reach.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Same modern line as `verify`/`contract` -- this job runs the repo's
          # own test harness (vitest), so it belongs on the verification-toolchain
          # Node version, not the published floor.
          node-version: 24.x

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - run: npm ci
      - run: npm run build
      - run: npx node scripts/run-test-category.mjs e2e

  verify-current:
    runs-on: ubuntu-latest
    # Deliberate canary, not a required gate: this job tracks the newest Node
    # line ahead of the verification toolchain's own line (24.x above, the
    # .nvmrc line), specifically so a real incompatibility
    # is visible before that version is adopted -- but a brand-new Node
    # line failing here is frequently an upstream toolchain gap (a
    # devDependency not yet supporting it) rather than a defect in this
    # package, and this repository has no control over when its own
    # dependencies catch up. continue-on-error keeps that upstream lag from
    # blocking every PR while this job still surfaces the result for a human
    # to actually look at, rather than silently skipping the check entirely.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes; nothing needs the checkout's stored token, so
          # don't leave it in `.git/config` for later steps to reach.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run size

  # Builds the package once, on the verification-toolchain Node line, and
  # hands the resulting tarball to `published-floor` below. Nothing downstream
  # rebuilds it -- the whole point is that the artifact tested on the old Node
  # floor is bit-for-bit the one a modern toolchain produced.
  package-build:
    # benchmark-pr listed directly (not just transitively via verify) so this job can address its
    # `outputs.sha` below -- a job's `needs` context only exposes outputs from its own direct
    # dependencies, not transitive ones.
    needs: [verify, benchmark-pr]
    # Same transitive-skip reasoning as `contract`'s own identical-shaped condition below --
    # GitHub's default `success()` considers the *entire* transitive dependency graph, not just
    # this job's direct `needs`, so a skipped `benchmark-pr` deep in `verify`'s own ancestry still
    # propagates through as "not success" here even when `verify` genuinely ran and passed.
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') && (needs.benchmark-pr.result == 'success' || needs.benchmark-pr.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `benchmark-pr`'s own resolved SHA output when it ran -- the exact commit it validated,
          # after its own possible push -- so this job checks out precisely that commit rather
          # than independently re-resolving `refs/pull/{N}/head` at a possibly-later moment. The
          # published tarball this job packs must be built from the exact tree `contract`
          # validated, not a stale pre-refresh snapshot. Falls back to the same ref-resolution
          # formula used everywhere else in this file when `benchmark-pr` didn't run at all.
          ref: ${{ needs.benchmark-pr.outputs.sha || (github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref) }}
          # No job here pushes; nothing needs the checkout's stored token, so
          # don't leave it in `.git/config` for later steps to reach.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - run: npm ci
      - run: npm run build
      # `npm pack --pack-destination` does not create the target directory.
      - run: mkdir -p ./artifacts
      - run: npm pack --pack-destination ./artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: artifacts/*.tgz
          retention-days: 1
          if-no-files-found: error

  # The published package's real Node floor, proven the only way that means
  # anything: install the packed tarball into a throwaway project as an
  # external consumer would, on each Node version `engines.node` promises,
  # and exercise both entry points. This job NEVER runs `npm ci` / `npm run
  # build` / the test harness -- it never installs the verification toolchain
  # at all, so a Node-22-only devDependency cannot affect it. See
  # scripts/smoke-consumer.mjs.
  published-floor:
    # benchmark-pr listed directly so this job can address its `outputs.sha` below -- see
    # `package-build`'s own identical note.
    needs: [package-build, benchmark-pr]
    # Same transitive-skip reasoning as `package-build`'s own identical-shaped condition above.
    if: always() && (needs.package-build.result == 'success' || needs.package-build.result == 'skipped') && (needs.benchmark-pr.result == 'success' || needs.benchmark-pr.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `benchmark-pr`'s own resolved SHA output when it ran, not an independently re-resolved
          # `refs/pull/{N}/head` -- this job's own `scripts/smoke-consumer.mjs` must be the same
          # version `contract` validated, not a stale pre-benchmark-pr-refresh snapshot. Falls back
          # to the same ref-resolution formula used everywhere else in this file when
          # `benchmark-pr` didn't run at all. Same reasoning as `package-build`'s identical
          # checkout override.
          ref: ${{ needs.benchmark-pr.outputs.sha || (github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref) }}
          # No job here pushes; nothing needs the checkout's stored token, so
          # don't leave it in `.git/config` for later steps to reach.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # No npm cache in any job (a cache written by a run of pull-request code can be poisoned) -- and this one never runs `npm ci` anyway.
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: artifacts

      - run: node scripts/smoke-consumer.mjs artifacts

  # Proves the shipped .d.ts files actually compile under a real consumer's
  # own toolchain, including a TypeScript release newer than this repo's own
  # build ever runs against (this repo's own tsconfig uses
  # moduleResolution: "Bundler" and a pinned typescript devDependency --
  # neither exercises nodenext resolution or a future major). See
  # scripts/typescript-compat.mjs.
  typescript-compat:
    # benchmark-pr listed directly so this job can address its `outputs.sha` below -- see
    # `package-build`'s own identical note.
    needs: [package-build, benchmark-pr]
    # Same transitive-skip reasoning as `package-build`'s own identical-shaped condition above.
    if: always() && (needs.package-build.result == 'success' || needs.package-build.result == 'skipped') && (needs.benchmark-pr.result == 'success' || needs.benchmark-pr.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same checkout-override reasoning as `published-floor`'s identical `ref:` -- this job's
          # own `scripts/typescript-compat.mjs` must be the same version `contract` validated.
          ref: ${{ needs.benchmark-pr.outputs.sha || (github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref) }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: artifacts

      - run: node scripts/typescript-compat.mjs artifacts

  # The slow, self-hosting proof: runs this repository's own
  # repo-contract.config.ts through the real, just-built public API -- see
  # that file's own `checks` record for the current, authoritative list of
  # every category it runs, and specs/verification-taxonomy.md for what each
  # one establishes. Doesn't need the full OS matrix (mutation testing
  # dominates runtime, and every check it runs is platform-independent and
  # already covered once by `lint` above) -- one Node version on the
  # verification-toolchain line (the .nvmrc line, >= the >=22.0.0 that
  # @stryker-mutator/core itself requires), a local-development-and-CI
  # requirement distinct from the published package's own engines.node
  # >=22.0.0 floor (proven by `published-floor`). Waits on both `verify` and
  # `lint` so a broken build/lint/OS-specific test fails fast, once, before
  # this much slower job spends its mutation-testing budget.
  contract:
    # benchmark-pr listed directly (not just transitively via verify/lint) so this job can address
    # its `outputs.sha` below -- a job's `needs` context only exposes outputs from its own direct
    # dependencies, not transitive ones.
    needs: [verify, lint, benchmark-pr]
    # Without this, `contract` would inherit GitHub's default `success()` condition, which
    # considers the *entire* transitive dependency graph, not just this job's direct `needs` --
    # so a skipped `benchmark-pr` (every push-to-main run, every fork PR) would silently skip
    # `contract` too even when `verify`/`lint` themselves genuinely ran and passed. Same
    # transitive-skip reasoning as every other job below `benchmark-pr` in this file.
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && (needs.benchmark-pr.result == 'success' || needs.benchmark-pr.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history, all branches -- see release.yml's own
      # identical setting) is required here, not optional: adr-governance and
      # commitlint both read `origin/main..HEAD` (scripts/git-commits.ts /
      # scripts/diff-files.ts), which the default single-commit shallow
      # checkout leaves unresolvable on a pull_request build and
      # identical-to-HEAD on a push-to-main build -- either way landing the
      # checks on a vacuous "nothing changed" pass path instead of actually
      # evaluating this run's commits. `api-contract` (internal-package-contract-sourced)
      # no longer needs this itself -- it now derives the declared release level from
      # `.changeset/*.md` files on disk, not commit history, since repo-contract's own
      # migration off release-please onto Changesets (see repo-contract.config.ts's own
      # module doc comment) -- but the checkout depth stays for the two checks that still do.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `benchmark-pr`'s own resolved SHA output when it ran, not an independently
          # re-resolved `refs/pull/{N}/head` -- the exact commit it validated, after its own
          # possible push. Falls back to the same ref-resolution formula used everywhere else in
          # this file when `benchmark-pr` didn't run at all.
          ref: ${{ needs.benchmark-pr.outputs.sha || (github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref) }}
          fetch-depth: 0
          # This job only reads `origin/main..HEAD`; it never pushes, so the
          # checkout's token does not need to persist into `.git/config`.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - run: npm ci
      - run: npm run build
      # Generates docs/api/ into the working tree (gitignored, never committed --
      # see .gitignore) purely so the `docs` check below has real content to
      # validate docs/index.html's link to it against. Without this, a fresh
      # checkout has no docs/api/ at all (it's only ever committed nowhere now --
      # the GitHub Pages deploy job regenerates it separately, on push to main),
      # and linkinator fails every PR with a spurious 404 on a link that is, in
      # fact, live on the real site.
      - run: npm run docs:api
      # Same "gitignored, regenerated fresh here so the `docs` check has real content to validate
      # docs/index.html's own link against, never committed" treatment as docs:api immediately
      # above -- internal-package-contract's shared benchmark engine builds this history chart
      # page from the already-committed benchmarks/history/*.json files (see `benchmark-pr`'s own
      # header comment above for where those come from); this step never runs the benchmarks
      # themselves, it only renders whatever history is already on disk. Regenerated again, with
      # whatever history `benchmark-pr` may have just appended, in `pages-content` below for the
      # real deploy -- this copy only needs to exist, not be perfectly current.
      - run: >-
          node node_modules/internal-package-contract/scripts/benchmark/render-page.mjs
          --out docs/benchmarks/index.html
          --readme https://github.com/maverickcer/repo-contract/blob/main/benchmarks/README.md
          --history 'Checks|benchmarks/history/checks.json'
          --history 'Policy & evidence|benchmarks/history/policy-evidence.json'
          --history 'API contract|benchmarks/history/api-contract.json'
      - run: npm run benchmark:check
      - run: npm run contract
        env:
          # SecuritySocket scores the package on Socket.dev and FAILS without a token. Create a
          # token at socket.dev (Settings > API Tokens, `packages:list`) and add it as the
          # repository or organization secret SOCKET_SECURITY_API_KEY.
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}

      # A contract run is not a pure read: `format`/`lint` auto-fix, and
      # `suppression-governance` reconciles `.repo-contract/exceptions/*.json`
      # (scaffolding a blank stub for any new disable directive, surfacing a
      # stale record whose directive moved). On a fully-governed tree the run
      # writes nothing; CI starts from a clean checkout, so ANY post-run
      # working-tree change means an ungoverned finding, an unformatted file, or
      # an un-added exception stub slipped through. Fail loudly rather than let
      # it ride along with a green run -- see
      # specs/decisions/0013-reusable-exception-policy-helper.md's "review
      # surface" amendment (invariant 8).
      #
      # docs/OpenSSF-Scorecard.md is excluded on purpose, not an oversight:
      # that check stamps a fresh `_Generated <timestamp>_` line into the doc
      # on every single run by design (see that generator's own
      # render-markdown.ts), so its content NEVER reproduces byte-identical
      # against whatever's already committed -- unlike every other file this
      # guard watches, no local `npm run contract` + commit could ever make
      # this diff disappear. Its regenerate-and-commit lifecycle is the
      # `docs-evidence` job below, mirroring `badges`' identical
      # push-to-main-only pattern.
      - name: Working tree is clean after the contract run
        run: |
          if [ -n "$(git status --porcelain -- . ':!docs/OpenSSF-Scorecard.md')" ]; then
            echo "::error::The contract run left the working tree dirty. A new disable directive needs its exception stub filled in and committed (.repo-contract/exceptions/), a file needs formatting, or a stale exception record needs deleting. Run 'npm run contract' locally and commit the result."
            git status --porcelain -- . ':!docs/OpenSSF-Scorecard.md'
            git diff -- . ':!docs/OpenSSF-Scorecard.md'
            exit 1
          fi

      # Handed to `badges` below so it can regenerate docs/*-badge.json
      # without re-running mutation testing -- the single most expensive
      # thing this job does (see the job-level comment above). Uploaded
      # unconditionally (cheap) even though only the push-to-main run ever
      # consumes it, since a job condition can't see whether a later job
      # will need it.
      - name: Upload coverage and mutation reports for badge generation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: badge-source-reports
          path: |
            coverage/aggregate/coverage-summary.json
            reports/mutation/mutation.json
          retention-days: 1
          if-no-files-found: error

      # Handed to `docs-evidence` below. The `npm run contract` step above
      # already wrote this file fresh (as a side effect of the
      # `openssf-scorecard` check actually running) -- uploading the
      # already-generated file, rather than having `docs-evidence` regenerate
      # it itself, avoids paying for a whole second `npm run contract`
      # invocation (including the mutation suite) just to reproduce a doc
      # this job already has.
      - name: Upload generated evidence docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-evidence-docs
          path: |
            docs/OpenSSF-Scorecard.md
          retention-days: 1
          if-no-files-found: error

  # Regenerates docs/coverage-badge.json, docs/mutation-badge.json, and the
  # evidence doc from the same coverage/mutation reports and generated-doc
  # copies `contract` just produced (reused via upload/download-artifact above
  # rather than re-run -- re-running through `npm run contract` a second time
  # here would double-pay the mutation suite, the single most expensive thing
  # that job does). GitHub Pages here is now the same artifact-based
  # actions/deploy-pages flow env-cap/data-cap already use, not the legacy
  # branch-deploy this repo used before this migration -- so this content is
  # handed to `deploy` below as a build artifact, never committed to main.
  # Push-to-main only: a PR's badge numbers are exactly `contract`'s
  # report-only concern.
  #
  # No longer opens a bot PR (superseding this job's prior use of
  # scripts/carry-forward-required-checks.sh -- that mechanism has nothing
  # left to carry forward here, since nothing merges to main from this job
  # anymore). Folds the former `docs-evidence` job into this one: both are the
  # same "already-generated content, needs to reach Pages" concern.
  pages-content:
    needs: contract
    # `always()` + an explicit check of `contract`'s own result, not the bare push-to-main
    # condition alone -- without it, this job inherits GitHub's default `success()`, which walks
    # `contract`'s entire transitive ancestry (verify, lint, benchmark-pr), and benchmark-pr is
    # always skipped on a push-to-main event (it only ever runs for pull_request), silently
    # skipping this job (and `deploy` below) even when `contract` itself genuinely ran and
    # passed. `contract` never itself concludes "skipped" on a push-to-main event (its own `if:`
    # already tolerates every job in that ancestry), so no skip-tolerance is needed here, only the
    # `always()` escape from the default walk -- same pattern as env-cap's/data-cap's own
    # `badges`/`deploy` jobs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always() && needs.contract.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: badge-source-reports

      - run: node scripts/generate-badges.mjs

      # setup-node + npm ci -- needed only for the render-page.mjs step below
      # (internal-package-contract's shared benchmark engine); generate-badges.mjs above is
      # dependency-free and doesn't need node_modules at all.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - run: npm ci

      # Same treatment as docs/api/ (generated fresh on every deploy, never committed) --
      # internal-package-contract's shared benchmark engine builds this history chart page from
      # the committed benchmarks/history/*.json files (see `benchmark-pr`'s own header comment
      # above for where those come from). Lands at maverickcer.github.io/repo-contract/benchmarks/.
      - run: >-
          node node_modules/internal-package-contract/scripts/benchmark/render-page.mjs
          --out docs/benchmarks/index.html
          --readme https://github.com/maverickcer/repo-contract/blob/main/benchmarks/README.md
          --history 'Checks|benchmarks/history/checks.json'
          --history 'Policy & evidence|benchmarks/history/policy-evidence.json'
          --history 'API contract|benchmarks/history/api-contract.json'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-evidence-docs
          path: docs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-content
          path: |
            docs/coverage-badge.json
            docs/mutation-badge.json
            docs/OpenSSF-Scorecard.md
            docs/benchmarks/index.html
          retention-days: 1
          if-no-files-found: error

  # Deploys docs/ (the GitHub Pages site) via the shared, centrally-maintained
  # reusable workflow hosted in internal-package-contract -- the same
  # actions/deploy-pages mechanism env-cap/data-cap already use. `badges-script`
  # is left empty deliberately: this repo's badge JSON depends on the mutation
  # report `contract` already paid for, so `pages-content` above generates it,
  # not this job -- `content-artifact-name` hands that pre-built content over
  # instead. `docs/api/` is generated fresh on every run by `docs:api`
  # (TypeDoc, via internal-package-contract's shared config -- the same
  # mechanism env-cap/data-cap already use `docs-script` for; this repo used
  # to pass its own bespoke `api-docs:html` here before this migration) inside
  # the shared workflow; no longer release-cadence-only -- see
  # RELEASING.md's "GitHub Pages" section and
  # specs/decisions/0008-self-hosting-tool-and-dependency-choices.md's amendment.
  deploy:
    needs: pages-content
    # Same transitive-skip reasoning as `pages-content`'s own identical-shaped condition above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always() && needs.pages-content.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: MaverickCER/internal-package-contract/.github/workflows/deploy-pages-typedoc.yml@c8b6147aef3592dd1941f8d22325abc9f279e7b7 # v0.9.0
    with:
      docs-script: docs:api
      content-artifact-name: pages-content

  # Belt-and-suspenders for the squash-merge case (see
  # specs/decisions/0009-conventional-commits-versioning-and-local-gates.md): the merge-commit /
  # rebase policy keeps every commit conforming, but if a squash ever slips
  # through, the PR title was still a valid Conventional Commit.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
