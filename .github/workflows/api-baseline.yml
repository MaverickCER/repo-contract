name: API baseline

# A thin caller of internal-package-contract's own reusable `api-baseline-sync.yml` workflow --
# the shared, centrally-maintained counterpart to what this file used to hand-roll itself (this
# repo's own scripts/api-contract/update-baseline.ts, before that engine moved to
# internal-package-contract alongside the rest of `api-contract` -- see
# repo-contract.config.ts's own module doc comment). Keeps
# `.repo-contract/api-contract/<target>/baseline.*` in sync with each release, automatically, so
# it is never a manual post-release step (it was: "after a release ships, run
# `npm run contract:baseline` and commit").
#
# The `on:`/trigger shape stays here -- that is the caller's responsibility, not the reusable
# workflow's (which declares only `on: workflow_call`, no inputs). Runs only on the Changesets
# "Version Packages" PR branch (changeset-release/main, which bumps package.json) -- the reusable
# workflow itself re-checks `github.head_ref == 'changeset-release/main'` before doing anything, so
# a run on any other branch is a fast no-op, not a wasted baseline regeneration. The baseline is
# committed straight onto that PR branch, so it lands atomically with the version bump and
# CHANGELOG entry -- no direct push to protected `main`, no follow-up PR.
#
# docs/api/ (the browsable HTML API reference) is not this job's concern -- it's generated fresh
# on every push to main by the GitHub Pages deploy job in ci.yml instead. See RELEASING.md's
# "GitHub Pages" section and specs/decisions/0008-self-hosting-tool-and-dependency-choices.md's
# amendment for why.
#
# RELEASING.md documents the manual backstop if this job is ever disabled:
# `npm run contract:baseline` (`internal-package-contract update-baseline`).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  update-baseline:
    permissions:
      contents: write
    uses: MaverickCER/internal-package-contract/.github/workflows/api-baseline-sync.yml@f8604a0bf289bfaba06df0d752a1dcfdacdf1709 # v0.9.0
