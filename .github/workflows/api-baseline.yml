name: API baseline

# Keeps two generated artifacts in sync with each release, automatically, so
# neither is a manual post-release step:
#
# - .repo-contract/api-contract/baseline.* (it was: "after a release ships,
#   run `npm run contract:baseline` and commit").
# - docs/api/, the browsable HTML API reference (it was: nothing -- this
#   artifact didn't exist before specs/decisions/0008's "a real, browsable
#   HTML API reference" amendment).
#
# Both share this one job deliberately, not a sibling workflow: they need the
# identical expensive prerequisites (a write-permission checkout of the
# Release PR branch, `npm ci`, `npm run build`), and both push a commit to
# that same branch -- two workflows racing that push is a real hazard this
# job's own `concurrency` group only serializes *within* one workflow. The
# job/workflow names stay "API baseline"/"update-baseline" despite now
# covering more than the baseline alone: both are check-list identifiers
# branch protection may reference, so renaming them is a real (if quiet)
# breaking change, not a cosmetic one.
#
# Runs only on release-please's own Release PR branch (which bumps package.json).
# Both artifacts are committed straight onto that PR branch, so they land
# atomically with the version bump and CHANGELOG entry -- no direct push to
# protected `main`, no follow-up PR.
#
# The job re-fires on every `synchronize` of that PR: its own commit, and
# every time release-please refreshes the PR because another change merged to
# `main` while it sat open. That is fine -- both generation steps are
# idempotent (see each one's own note below), so a re-run with nothing new to
# regenerate commits nothing and stays green.
#
# RELEASING.md documents the manual backstop for each artifact if this job is
# ever disabled: `npm run contract:baseline` for the api-contract baseline,
# `npm run api-docs:html` for docs/api/.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Serialize runs for the same Release PR branch: this job pushes a commit back
# onto that branch, and two overlapping runs (a fast `synchronize` after the
# push, say) would race to regenerate and push the baseline. `cancel-in-progress`
# is deliberately false -- a run must not be interrupted mid-`git push`.
concurrency:
  group: api-baseline-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-baseline:
    # release-please's Release PR branch. With a manifest release (a `packages`
    # entry in release-please-config.json) the branch carries a component
    # suffix -- `release-please--branches--main--components--repo-contract` --
    # rather than the bare `release-please--branches--main`. Match the prefix so
    # this keeps working whichever form release-please uses.
    if: startsWith(github.head_ref, 'release-please--branches--main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci
      - run: npm run build
      # Idempotent: a no-op (exit 0, no file writes) once the baseline already
      # carries package.json's version. See update-baseline.ts.
      - run: npm run contract:baseline
      # Idempotent by construction: fully wipes and regenerates docs/api/ from
      # the same built dist/.dts/ every time, so a re-run with no underlying
      # API change reproduces byte-identical output. Release-cadence only, by
      # design -- see specs/decisions/0008's amendment for why this artifact,
      # unlike the api-contract baseline above, has no every-commit freshness
      # check of its own.
      - name: Regenerate the HTML API reference
        run: npm run api-docs:html

      - name: Commit the regenerated baseline and API reference
        env:
          # Passed through the environment rather than interpolated straight into
          # `run` -- a branch ref is attacker-influenced input and must never be
          # spliced into the shell command text.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git add` first, then diff the INDEX: plain `git diff --quiet` never
          # sees untracked files, so it would silently skip docs/api/'s very
          # first commit (and any commit after a full wipe+regenerate produced
          # an empty-then-repopulated directory) -- a real bug the api-contract
          # baseline's own older guard didn't have to worry about, since
          # .repo-contract/api-contract/ is already tracked.
          git add -A -- .repo-contract/api-contract docs/api
          if git diff --cached --quiet -- .repo-contract/api-contract docs/api; then
            echo "Generated artifacts already current; nothing to commit."
            exit 0
          fi
          git commit -m "chore: sync generated API baseline and HTML docs for release"
          git push origin HEAD:"$HEAD_REF"
