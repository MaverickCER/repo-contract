name: API baseline

# Keeps .repo-contract/api-contract/baseline.* in sync with each release,
# automatically, so it is no longer a manual post-release step (it was:
# "after a release ships, run `npm run contract:baseline` and commit").
#
# Runs only on release-please's own Release PR branch (which bumps package.json).
# The regenerated baseline is committed straight onto that PR branch, so it lands
# atomically with the version bump and CHANGELOG entry -- no direct push to
# protected `main`, no follow-up PR.
#
# The job re-fires on every `synchronize` of that PR: its own baseline commit,
# and every time release-please refreshes the PR because another change merged to
# `main` while it sat open. That is fine -- `npm run contract:baseline` is
# idempotent: it exits 0 and writes nothing once the baseline already carries
# package.json's version and its contents match (it still re-writes if an
# API-changing commit landed on the branch at the same version). See
# scripts/api-contract/update-baseline.ts for the full outcome matrix.
#
# RELEASING.md documents `npm run contract:baseline` as the manual backstop if
# this job is ever disabled.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Serialize runs for the same Release PR branch: this job pushes a commit back
# onto that branch, and two overlapping runs (a fast `synchronize` after the
# push, say) would race to regenerate and push the baseline. `cancel-in-progress`
# is deliberately false -- a run must not be interrupted mid-`git push`.
concurrency:
  group: api-baseline-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-baseline:
    # release-please's Release PR branch. With a manifest release (a `packages`
    # entry in release-please-config.json) the branch carries a component
    # suffix -- `release-please--branches--main--components--repo-contract` --
    # rather than the bare `release-please--branches--main`. Match the prefix so
    # this keeps working whichever form release-please uses.
    if: startsWith(github.head_ref, 'release-please--branches--main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci
      - run: npm run build
      # Idempotent: a no-op (exit 0, no file writes) once the baseline already
      # carries package.json's version. See update-baseline.ts.
      - run: npm run contract:baseline

      # When contract:baseline was a no-op the working tree is clean and the
      # `git diff --quiet` guard below exits before committing -- so this job's
      # own push (or any later re-run) never turns into a red check.
      - name: Commit the regenerated baseline
        env:
          # Passed through the environment rather than interpolated straight into
          # `run` -- a branch ref is attacker-influenced input and must never be
          # spliced into the shell command text.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- .repo-contract/api-contract; then
            echo "Baseline already current; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .repo-contract/api-contract
          git commit -m "chore: sync api-contract baseline for release"
          git push origin HEAD:"$HEAD_REF"
