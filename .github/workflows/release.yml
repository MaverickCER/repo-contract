# internal-package-contract caller workflow. It runs the shared release flow (Changesets and npm
# OIDC trusted publishing) on every push to main. Do not inline the release logic here.
# It lives in the reusable workflow this calls, pinned below by commit SHA. A fix there reaches
# this repository when the pin-sync pull request moves the SHA. The reusable workflow:
# https://github.com/MaverickCER/internal-package-contract/blob/main/.github/workflows/release-npm-changesets.yml
#
# This replaced release-please and this repository's own verify and publish jobs. data-cap and
# env-cap call the same workflow. It has no manual recovery input, so a failed release is
# recovered as RELEASING.md describes.
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Each job grants only what it needs; nothing is granted workflow-wide.
permissions: {}

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      # Enables npm's OIDC trusted publishing: see the called workflow's own
      # comment. Required here too: GitHub caps the called workflow's effective
      # permissions at the intersection of what this caller grants and what it
      # itself declares.
      id-token: write
      # The shared workflow dispatches this repo's CI on the release PR's branch and watches it, which
      # needs `actions: write`. A caller that grants less than the called workflow declares makes
      # GitHub refuse to start the run at all (a `startup_failure`). Releases then silently never ran.
      actions: write
    uses: MaverickCER/internal-package-contract/.github/workflows/release-npm-changesets.yml@de11cec0f2cd93bbac00512ba706db3f4bbf5e09 # v0.19.0
