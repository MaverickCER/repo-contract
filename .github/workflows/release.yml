# internal-package-contract caller workflow. Runs the shared Changesets + npm OIDC
# trusted-publishing release flow on every push to main. Replace nothing -- the real
# logic lives in the shared, centrally-maintained reusable workflow this calls; a fix
# or improvement there reaches every consumer without a per-repo edit. See
# https://github.com/MaverickCER/internal-package-contract/blob/main/.github/workflows/release-npm-changesets.yml
#
# Migrated off release-please (see RELEASING.md) -- same shape data-cap/env-cap
# already use, dropping this repo's own former verify/publish jobs and
# workflow_dispatch recovery input (no equivalent exists in the shared workflow;
# neither sibling repo has one either -- recovery now follows the shared workflow's
# own conventions, same as any other consumer).
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      # Enables npm's OIDC trusted publishing -- see the called workflow's own
      # comment. Required here too: GitHub caps the called workflow's effective
      # permissions at the intersection of what this caller grants and what it
      # itself declares.
      id-token: write
      # The shared workflow dispatches this repo's CI on the release PR's branch and watches it, which
      # needs `actions: write`. A caller that grants less than the called workflow declares makes
      # GitHub refuse to start the run at all (a `startup_failure`), so releases silently never ran.
      actions: write
    uses: MaverickCER/internal-package-contract/.github/workflows/release-npm-changesets.yml@c8b6147aef3592dd1941f8d22325abc9f279e7b7 # v0.9.0
