# internal-package-contract caller workflow. Runs the shared Changesets + npm OIDC
# trusted-publishing release flow on every push to main. Replace nothing -- the real
# logic lives in the shared, centrally-maintained reusable workflow this calls; a fix
# or improvement there reaches every consumer without a per-repo edit. See
# https://github.com/MaverickCER/internal-package-contract/blob/main/.github/workflows/release-npm-changesets.yml
#
# Migrated off release-please (see RELEASING.md) -- same shape data-cap/env-cap
# already use, dropping this repo's own former verify/publish jobs and
# workflow_dispatch recovery input (no equivalent exists in the shared workflow;
# neither sibling repo has one either -- recovery now follows the shared workflow's
# own conventions, same as any other consumer).
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      # Enables npm's OIDC trusted publishing -- see the called workflow's own
      # comment. Required here too: GitHub caps the called workflow's effective
      # permissions at the intersection of what this caller grants and what it
      # itself declares.
      id-token: write
      # The shared workflow dispatches this repo's CI on the release PR's branch and watches it, which
      # needs `actions: write`. A caller that grants less than the called workflow declares makes
      # GitHub refuse to start the run at all (a `startup_failure`), so releases silently never ran.
      actions: write
    uses: MaverickCER/internal-package-contract/.github/workflows/release-npm-changesets.yml@8e8f6809fd77b44b6946d93c1df11e011f363680 # main, parts B/C/E

  # Propagates this release to internal-package-contract (part E of the
  # "Standardize npm release + Pages deploy" plan): internal-package-contract
  # depends on repo-contract as a real functional/engine coupling (not just a
  # devDependency version tick), so its own version needs to move by a matching
  # severity whenever repo-contract publishes. Requires a fine-grained PAT
  # (CROSS_REPO_PAT) -- the default GITHUB_TOKEN cannot dispatch to another
  # repository at all. See RELEASING.md's one-time bootstrap step.
  notify-internal-package-contract:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    # This job authenticates entirely via CROSS_REPO_PAT (below), never GITHUB_TOKEN
    # -- an explicit empty block, not an omission, so it never inherits a broader
    # default than it needs.
    permissions: {}
    steps:
      - name: Dispatch repo-contract-released
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          gh api repos/MaverickCER/internal-package-contract/dispatches \
            -f event_type=repo-contract-released \
            -f "client_payload[version]=${{ needs.release.outputs.version }}" \
            -f "client_payload[bump-type]=${{ needs.release.outputs.bump-type }}"
