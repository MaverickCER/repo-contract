# Keeps this repo's internal-package-contract pin current. PULLS: a daily check (or a manual run)
# re-resolves the pin from this repository. Reading the newest release needs no token.
# Every bump also re-pins the workflow SHAs in release.yml, ci.yml and this file.
# GitHub does not let GITHUB_TOKEN push a change to .github/workflows/*, so that push needs the
# PIN_SYNC_TOKEN secret below. It is this repository's own fine-grained token, with Contents,
# Pull requests, Workflows and Actions write (RELEASING.md, "One-time setup"). It expires like any token.
name: Sync internal-package-contract version

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

# Each job grants only what it needs; nothing is granted workflow-wide.
permissions: {}

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: MaverickCER/internal-package-contract/.github/workflows/dependency-pin-sync.yml@de11cec0f2cd93bbac00512ba706db3f4bbf5e09 # v0.19.0
    with:
      dependency-name: internal-package-contract
    secrets:
      # Optional. Without it the run uses GITHUB_TOKEN, which GitHub does not allow to change workflow files.
      PIN_SYNC_TOKEN: ${{ secrets.PIN_SYNC_TOKEN }}
