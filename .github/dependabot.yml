# Automated dependency and workflow-action update PRs.
#
# The `security-deps` check (`npm audit`) reports a vulnerable dependency, but nothing else
# updates one. The workflows pin every action by SHA, and those pins go stale silently.
# Dependabot rewrites a pinned SHA and its `# vX.Y.Z` comment, the form the workflows use.
#
# Dev-dependency PRs are grouped into one weekly PR to keep the noise down.
# None of them reach consumers (the published package has no runtime
# dependencies at all). So they do not need per-package review.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    ignore:
      # TypeScript 7 removes the compiler API (createSourceFile, forEachChild, the scanner, ...) that
      # repo-contract's static analysis is written against; stay on 5.x/6.x until an adapter exists.
      # Everything below 7 still updates.
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
      # Releases run through internal-package-contract's shared release workflow, which drives this
      # Changesets CLI; a new major moves together with that workflow, not on its own.
      - dependency-name: "@changesets/cli"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR per week for the whole dev/verification toolchain: minor, patch,
      # AND major. None of it reaches consumers, so a batched bump is fine. A
      # major that actually breaks the build shows up as a red PR, not a silent
      # merge. Production deps are deliberately left out of every group (there are
      # none today; if one is ever added it gets its own reviewable PR).
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
          - major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
