# Automated dependency and workflow-action update PRs.
#
# Rationale (see the release-readiness audit, finding F1): every runtime
# dependency vulnerability already surfaces through this repo's own
# `security-deps` check (`npm audit --omit=dev`), and the SHA-pinned actions
# across the four workflows drift silently without something rewriting them.
# Dependabot rewrites a pinned action SHA *and* refreshes the `# vX.Y.Z` tag
# comment next to it, which is exactly the form `.github/workflows/*` already
# use.
#
# Dev-dependency PRs are grouped into one weekly PR to keep the noise down --
# none of them reach consumers (the published tree is `cross-spawn` plus a
# handful of transitive packages), so they do not need per-package review.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    groups:
      # One PR per week for the whole dev/verification toolchain.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Production deps are few and consumer-facing -- keep them ungrouped so
      # each gets its own reviewable PR, including majors.
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
