# Automated dependency and workflow-action update PRs.
#
# Rationale (see the release-readiness audit, finding F1): every runtime
# dependency vulnerability already surfaces through this repo's own
# `security-deps` check (`npm audit --omit=dev`), and the SHA-pinned actions
# across the four workflows drift silently without something rewriting them.
# Dependabot rewrites a pinned action SHA *and* refreshes the `# vX.Y.Z` tag
# comment next to it, which is exactly the form `.github/workflows/*` already
# use.
#
# Dev-dependency PRs are grouped into one weekly PR to keep the noise down --
# none of them reach consumers (the published package has no runtime
# dependencies at all), so they do not need per-package review.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    ignore:
      # TypeScript 7 removes the compiler API (createSourceFile, forEachChild, the scanner, ...) that
      # repo-contract's static analysis is written against; stay on 5.x/6.x until an adapter exists.
      # Everything below 7 still updates.
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
      # changesets/action v1 (used by the release workflow) targets Changesets CLI v2; CLI v3 needs the
      # action's v2. Move both together, then remove this rule.
      - dependency-name: "@changesets/cli"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR per week for the whole dev/verification toolchain -- minor, patch,
      # AND major. None of it reaches consumers, so a batched bump is fine; a
      # major that actually breaks the build shows up as a red PR, not a silent
      # merge. Production deps are deliberately left out of every group (there are
      # none today; if one is ever added it gets its own reviewable PR).
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
          - major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
