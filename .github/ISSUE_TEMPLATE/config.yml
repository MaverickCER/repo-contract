blank_issues_enabled: false
contact_links:
  - name: Question or usage help
    url: https://github.com/maverickcer/repo-contract/discussions
    about: >
      How to structure a policy, whether a check design fits the model, integration
      questions, general feedback — open a Discussion, not an issue.
  - name: Security vulnerability
    url: https://github.com/maverickcer/repo-contract/security/advisories/new
    about: >
      Report privately via a GitHub security advisory. Do not open a public issue. See
      SECURITY.md.
  - name: Feature request
    url: https://github.com/maverickcer/repo-contract/discussions/categories/ideas
    about: >
      Explain the problem, why the current API doesn't cover it, a proposed shape, and the
      alternatives considered — the bar this repo holds its own ADRs to.
